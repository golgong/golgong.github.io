name: 방문 통계 갱신

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: visitor-stats-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: 설정 확인
        id: config
        env:
          GA_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [[ -n "$GA_PROPERTY_ID" && -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "GA4 또는 Google Cloud 저장소 변수가 없어 방문 통계를 갱신할 수 없습니다." >&2
            exit 1
          fi

      - name: Python 준비
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 검증 도구 설치
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-site.txt

      - name: Google Cloud 인증
        if: steps.config.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly

      - name: 공개 집계 갱신
        if: steps.config.outputs.ready == 'true'
        env:
          GA_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python tools/update_visitor_stats.py

      - name: 사이트 검증
        if: steps.config.outputs.ready == 'true'
        run: |
          python tools/test_update_visitor_stats.py
          python tools/update_visitor_stats.py --validate-only
          python tools/validate_site.py

      - name: 변경 공개
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/visitor-stats.json; then
            echo "새 방문 통계가 없어 커밋하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "golgong"
          git config user.email "54047541+golgong@users.noreply.github.com"
          git add -- data/visitor-stats.json
          git commit -m "방문 통계 자동 갱신"
          git push origin HEAD:main
          echo "방문 통계를 갱신했습니다. main 반영 뒤 Pages가 자동 배포합니다." >> "$GITHUB_STEP_SUMMARY"
